name: Release Candidate Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify candidate source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - name: Check source
        run: |
          go mod verify
          sh ./scripts/check.sh
          go test -count=1 ./...
          go test -race -count=1 ./...
      - name: Install pinned release analyzers
        run: |
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOTOOLCHAIN=local go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          sudo apt-get update
          sudo apt-get install --yes lintian nftables shellcheck
      - name: Run release analysis and delivery checks
        run: |
          govulncheck ./...
          staticcheck -checks=all,-S1016,-ST1000,-U1000 ./...
          actionlint .github/workflows/*.yml
          shellcheck scripts/*.sh packaging/*.sh packaging/bundle/*.sh packaging/bundle/scripts/* packaging/debian/preinst packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
          sh ./scripts/verify-delivery-assets.sh
          sudo env "PATH=$PATH" sh ./scripts/validate-staged.sh
      - name: Build Debian package once
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sh ./scripts/build-deb.sh "$VERSION" "cnftctl_${VERSION}_amd64.deb"
          sh ./scripts/verify-deb.sh "cnftctl_${VERSION}_amd64.deb" "$VERSION"
          lintian --fail-on error "cnftctl_${VERSION}_amd64.deb"
      - name: Generate SPDX SBOM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.27.1
          mkdir sbom-root
          dpkg-deb --extract "cnftctl_${VERSION}_amd64.deb" sbom-root
          syft "dir:sbom-root" \
            --source-name cnftctl \
            --source-version "$VERSION" \
            -o spdx-json=sbom.spdx.json
      - name: Package and checksum candidate
        env:
          VERSION: ${{ inputs.version }}
        run: sha256sum "cnftctl_${VERSION}_amd64.deb" sbom.spdx.json > release-checksums.txt
      - name: Attest package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: cnftctl_${{ inputs.version }}_amd64.deb
      - name: Attest SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: cnftctl_${{ inputs.version }}_amd64.deb
          sbom-path: sbom.spdx.json
      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cnftctl-${{ inputs.version }}-candidate
          path: |
            cnftctl_${{ inputs.version }}_amd64.deb
            release-checksums.txt
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
