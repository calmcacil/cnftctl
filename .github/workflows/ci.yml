name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: sh ./scripts/check.sh

      - name: Build CLI
        run: go build -o ./bin/cnftctl ./cmd/cnftctl

      - name: Race tests
        run: go test -race ./...

  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned analyzers
        run: |
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOTOOLCHAIN=local go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Static analysis
        # Style-only conversions and intentionally dormant code are reviewed separately.
        run: staticcheck -checks=all,-S1016,-ST1000,-U1000 ./...

  delivery-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install shell and workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes lintian shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows and shell
        run: |
          actionlint .github/workflows/*.yml
          shellcheck scripts/*.sh packaging/*.sh packaging/bundle/*.sh packaging/bundle/scripts/* packaging/debian/preinst packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
      - name: Verify systemd and delivery assets
        run: sh ./scripts/verify-delivery-assets.sh
      - name: Build and verify delivery package
        run: |
          sh ./scripts/build-bundle.sh 0.0.0-ci "$RUNNER_TEMP/cnftctl-bundle"
          sh ./scripts/build-deb.sh 0.0.0-ci "$RUNNER_TEMP/cnftctl_0.0.0-ci_amd64.deb"
          sh ./scripts/verify-deb.sh "$RUNNER_TEMP/cnftctl_0.0.0-ci_amd64.deb" 0.0.0-ci
          lintian --fail-on error "$RUNNER_TEMP/cnftctl_0.0.0-ci_amd64.deb"

  nft-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:trixie-20250630-slim
      options: --cap-add NET_ADMIN
    steps:
      - name: Install runner dependencies
        run: apt-get update && apt-get install --yes ca-certificates git nftables
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate staged nftables syntax
        run: sh ./scripts/validate-staged.sh
