name: Release Candidate Promotion

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v
        required: true
        type: string
      candidate_run_id:
        description: Successful candidate workflow run ID
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: write

concurrency:
  group: release-promotion-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Download build-once candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cnftctl-${{ inputs.version }}-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify candidate, provenance, and version
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git tag --points-at HEAD)" = "v$VERSION"
          test "$(git rev-list -n 1 "v$VERSION^{commit}")" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .name)" = "Release Candidate Build"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .path)" = ".github/workflows/release-build.yml"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .event)" = workflow_dispatch
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .head_sha)" = "$GITHUB_SHA"
          cd candidate
          test "$(find . -type f -printf '%P\n' | LC_ALL=C sort)" = "$(printf '%s\n' "cnftctl-$VERSION-debian13-amd64.tar.gz" release-checksums.txt sbom.spdx.json | LC_ALL=C sort)"
          test -z "$(find . -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          sha256sum --check release-checksums.txt
          test "$(wc -l <release-checksums.txt)" -eq 2
          gh attestation verify "cnftctl-$VERSION-debian13-amd64.tar.gz" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release-build.yml@$GITHUB_SHA"
          mkdir unpacked
          tar -tzf "cnftctl-$VERSION-debian13-amd64.tar.gz" | grep -Eq '^cnftctl-[^/]+-debian13-amd64/$'
          tar -xzf "cnftctl-$VERSION-debian13-amd64.tar.gz" -C unpacked --no-same-owner --no-same-permissions
          bundle="unpacked/cnftctl-$VERSION-debian13-amd64"
          "$bundle/scripts/verify-bundle" "$bundle"
          test "$("$bundle/bin/cnftctl" --version)" = "cnftctl $VERSION"
      - name: Publish protected release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            "candidate/cnftctl-$VERSION-debian13-amd64.tar.gz" \
            candidate/release-checksums.txt \
            candidate/sbom.spdx.json \
            --verify-tag --generate-notes
