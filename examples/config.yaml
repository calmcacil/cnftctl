# Sanitized cnftctl config schema v1 example.
# Replace every value before using this on a real host.

version: 1
wan_interface: eth0

# Empty is safest: adding any tuple creates public WAN exposure for a matching
# host service and, when Docker gating is enabled, a published container service.
open_ports: []

ssh:
  mode: open
  rate_limit: null
  static_whitelist:
    ipv4:
      - value: 203.0.113.10
        comment: example administrator
      - value: 198.51.100.0/24
        comment: documentation network
    ipv6:
      - value: 2001:db8::10
        comment: example IPv6 administrator
      - value: 2001:db8:1234::/48
        comment: documentation prefix
  ddns_whitelist:
    enabled: false
    hosts:
      - home.example.com
    ttl: 1h
    refresh_interval: 5m
    ipv6_prefix_len: 56

trusted_interfaces:
  enabled: false
  interfaces:
    - tailscale0
  trust_forwarding: false

docker:
  enabled: false
  interfaces:
    - docker0
    - br-*
