# Sanitized cnftctl v1-style config example.
# Replace every value before using this on a real host.

wan_interface: eth0

open_ports:
  - protocol: tcp
    port: 443
    comment: HTTPS reverse proxy

ssh:
  mode: open
  rate_limit: null
  static_whitelist:
    ipv4:
      - 203.0.113.10
      - 198.51.100.0/24
    ipv6:
      - 2001:db8::10
      - 2001:db8:1234::/48
  ddns_whitelist:
    enabled: false
    hosts:
      - home.example.com
    ttl: 1h
    refresh_interval: 5m
    ipv6_prefix_len: 56

trusted_interfaces:
  enabled: false
  interfaces:
    - tailscale0
  trust_forwarding: false

docker:
  enabled: false
  allow_published_ports_by_default: false
  interfaces:
    - docker0
    - br-*
