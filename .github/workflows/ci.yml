name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: sh ./scripts/check.sh

      - name: Build CLI
        run: go build -o ./bin/cnftctl ./cmd/cnftctl

      - name: Race tests
        run: go test -race ./...

  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned analyzers
        run: |
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOTOOLCHAIN=local go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Static analysis
        # Style-only conversions and intentionally dormant code are reviewed separately.
        run: staticcheck -checks=all,-S1016,-ST1000,-U1000 ./...

  delivery-native:
    name: delivery-assets (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install shell and workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes lintian shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows and shell
        run: |
          actionlint .github/workflows/*.yml
          shellcheck scripts/*.sh packaging/*.sh packaging/bundle/*.sh packaging/bundle/scripts/* packaging/debian/preinst packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
      - name: Verify systemd and delivery assets
        run: sh ./scripts/verify-delivery-assets.sh
      - name: Build and verify delivery package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(dpkg --print-architecture)" = "$ARCH"
          sh ./scripts/check.sh
          sh ./scripts/build-bundle.sh 0.0.0-ci "$ARCH" "$RUNNER_TEMP/cnftctl-bundle"
          sh ./scripts/build-deb.sh 0.0.0-ci "$ARCH" "$RUNNER_TEMP/cnftctl_0.0.0-ci_${ARCH}.deb"
          sh ./scripts/verify-deb.sh "$RUNNER_TEMP/cnftctl_0.0.0-ci_${ARCH}.deb" 0.0.0-ci "$ARCH"
          "$RUNNER_TEMP/cnftctl-bundle/bin/cnftctl" --version
          lintian --fail-on error "$RUNNER_TEMP/cnftctl_0.0.0-ci_${ARCH}.deb"

  delivery-assets:
    needs: delivery-native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm native delivery matrix
        run: echo "amd64 and arm64 delivery checks passed"

  nft-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:trixie-20250630-slim
      options: --cap-add NET_ADMIN
    steps:
      - name: Install runner dependencies
        run: apt-get update && apt-get install --yes ca-certificates git nftables
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate staged nftables syntax
        run: sh ./scripts/validate-staged.sh
