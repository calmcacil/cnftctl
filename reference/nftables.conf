#!/usr/sbin/nft -f

# WARNING: UNSUPPORTED REFERENCE ONLY. Do not execute or install this file as a
# cnftctl deployment; it has no durable transaction or systemd rollback.
# Reference nftables firewall for Docker hosts.
#
# Model:
# - Host input is default-deny.
# - WAN can reach host services only when listed in open_ports.
# - WAN can reach Docker-published services only when listed in open_ports.
# - Docker may publish ports, but this firewall gates WAN access first.
# - SSH is allowed only from trusted VPN, static whitelist, or dynamic DDNS whitelist.

# Safe, idempotent table cleanup compatible with Docker-managed nftables rules.
# Do not use "flush ruleset" on Docker hosts unless you intend to remove Docker's tables too.
table inet hostfw {}
delete table inet hostfw

# Static SSH whitelist containing trusted admin IP variables.
# Dynamic DDNS whitelist sets are defined below.
include "/etc/nftables.d/whitelist.nft"

# WAN_IF: Internet-facing interface.
# Find it with:
#   ip route show default
# Common examples: eth0, ens18, eno1, enp7s0.
define WAN_IF = "eth0"

# Trusted private VPN/overlay interfaces.
# Examples:
#   tailscale0 = Tailscale
#   wt0        = Netbird
#   wg0        = WireGuard
define VPN_IFS = { "tailscale0" }

# Docker bridge interfaces.
# docker0 is Docker's default bridge.
# br-* covers user-defined Docker bridge networks.
define DOCKER_IFS = { "docker0", "br-*" }

table inet hostfw {
    # Dynamic DDNS SSH whitelist sets.
    # These start empty after nftables reload and are repopulated by the DDNS updater.
    # Entries expire automatically if updates stop.
    set ddns_whitelist_v4 { type ipv4_addr; flags timeout; timeout 1h; }
    set ddns_whitelist_v6 { type ipv6_addr; flags interval, timeout; timeout 1h; }

    # Consolidated public WAN ports.
    include "/etc/nftables.d/open-ports.nft"

    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Accept ICMP/ICMPv6 early.
        # Important for diagnostics, IPv6 NDP, and Path MTU Discovery.
        # Some NDP packets can be marked invalid by conntrack, so keep this before invalid drops.
        ip protocol icmp accept
        meta l4proto icmpv6 accept

        # 2. Trust private VPN/overlay interfaces early.
        # This gives authenticated VPN clients full host access without per-port rules.
        iifname $VPN_IFS accept

        # 3. Fast-path established and related traffic.
        ct state established,related accept

        # 4. Drop invalid TCP only.
        # Avoid globally dropping invalid UDP because virtual interfaces/checksum offload can
        # make valid UDP/QUIC packets appear invalid transiently.
        meta l4proto tcp ct state invalid drop

        # 5. Loopback.
        iifname "lo" accept

        # 6. Trust Docker bridge traffic to host services.
        # Convenient for containers reaching host DNS/resolvers/APIs, but containers are
        # trusted to connect to host services.
        iifname $DOCKER_IFS accept

        # 7. Anti-spoofing: Unicast Reverse Path Filtering (uRPF).
        # Scope to WAN to avoid false-positive drops on private, routed, or asymmetric interfaces.
        # Avoid running uRPF on IPv6 link-local (fe80::/10), which may not have normal routes.
        iifname $WAN_IF meta nfproto ipv4 fib saddr . iif oif missing drop
        iifname $WAN_IF ip6 saddr != fe80::/10 fib saddr oif missing drop

        # 8. Basic TCP SYN flood mitigation.
        tcp flags syn limit rate over 200/second burst 50 packets drop

        # 9. SSH policy.
        # VPN clients were already accepted above.
        # Static whitelist and dynamic DDNS entries are allowed here.
        # Non-whitelisted public SSH is dropped by the input chain policy.
        ip saddr $whitelist_v4 tcp dport 22 accept
        ip6 saddr $whitelist_v6 tcp dport 22 accept
        ip saddr @ddns_whitelist_v4 tcp dport 22 accept
        ip6 saddr @ddns_whitelist_v6 tcp dport 22 accept

        # 10. Public host services from WAN only.
        # The same open_ports set is also used by the Docker WAN gate below.
        iifname $WAN_IF meta l4proto . th dport @open_ports accept
    }

    chain forward_wan_gate {
        type filter hook forward priority filter - 1; policy accept;

        # This chain is a WAN-to-Docker gate, not a full router firewall.
        # Policy accept preserves Docker's own forwarding behavior while still dropping
        # unauthorized WAN -> Docker attempts before Docker's allow rules can matter.

        # 1. Forward ICMP/ICMPv6 for PMTUD.
        ip protocol icmp accept
        meta l4proto icmpv6 accept

        # 2. Trust VPN forwarded traffic.
        iifname $VPN_IFS accept
        oifname $VPN_IFS accept

        # 3. Fast-path established and related forwarded packets.
        ct state established,related accept

        # 4. Drop invalid TCP only.
        meta l4proto tcp ct state invalid drop

        # 5. Gate WAN -> Docker bridge traffic.
        # IPv4 Docker published ports usually use DNAT.
        meta nfproto ipv4 iifname $WAN_IF oifname $DOCKER_IFS ct status dnat jump docker_wan_allow

        # IPv6 may be DNATed or routed directly to container GUAs.
        meta nfproto ipv6 iifname $WAN_IF oifname $DOCKER_IFS jump docker_wan_allow_ipv6
    }

    chain docker_wan_allow {
        # IPv4 DNATed Docker published ports.
        # Match the original public destination port before Docker DNAT rewrote it.
        meta l4proto . ct original proto-dst @open_ports accept

        # Block unauthorized WAN -> Docker attempts.
        drop
    }

    chain docker_wan_allow_ipv6 {
        # DNATed IPv6 Docker published ports.
        ct status dnat meta l4proto . ct original proto-dst @open_ports accept

        # Routed IPv6 container services without DNAT.
        meta l4proto . th dport @open_ports accept

        # Block unauthorized WAN -> Docker attempts.
        drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
