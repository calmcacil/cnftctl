name: Release Candidate Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify tag and source version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git tag --points-at HEAD)" = "v$VERSION"
          test "$(git rev-list -n 1 "v$VERSION^{commit}")" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "v$VERSION" || test "$GITHUB_EVENT_NAME" = workflow_dispatch
      - name: Check source
        run: |
          go mod verify
          sh ./scripts/check.sh
          go test -count=1 ./...
          go test -race -count=1 ./...
      - name: Install pinned release analyzers
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          sudo apt-get update
          sudo apt-get install --yes nftables shellcheck
      - name: Run release analysis and delivery checks
        run: |
          govulncheck ./...
          staticcheck -checks=all,-S1016,-ST1000,-U1000 ./...
          actionlint .github/workflows/*.yml
          shellcheck scripts/*.sh packaging/*.sh packaging/bundle/*.sh packaging/bundle/scripts/*
          sh ./scripts/verify-delivery-assets.sh
          sh ./scripts/validate-staged.sh
      - name: Build bundle once
        env:
          VERSION: ${{ inputs.version }}
        run: sh ./scripts/build-bundle.sh "$VERSION" "dist/cnftctl-$VERSION-debian13-amd64"
      - name: Generate SPDX SBOM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.27.1
          syft "dir:dist/cnftctl-$VERSION-debian13-amd64" \
            --source-name cnftctl \
            --source-version "$VERSION" \
            -o spdx-json=sbom.spdx.json
      - name: Package and checksum candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist -czf "cnftctl-$VERSION-debian13-amd64.tar.gz" "cnftctl-$VERSION-debian13-amd64"
          sha256sum "cnftctl-$VERSION-debian13-amd64.tar.gz" sbom.spdx.json > release-checksums.txt
      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.2
        with:
          subject-path: cnftctl-${{ inputs.version }}-debian13-amd64.tar.gz
      - name: Attest SBOM
        uses: actions/attest-sbom@49f9f8f01a66efd2e17363a7f9b9f2ba56e9ac21 # v2.2.1
        with:
          subject-path: cnftctl-${{ inputs.version }}-debian13-amd64.tar.gz
          sbom-path: sbom.spdx.json
      - name: Upload immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cnftctl-${{ inputs.version }}-candidate
          path: |
            cnftctl-${{ inputs.version }}-debian13-amd64.tar.gz
            release-checksums.txt
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
