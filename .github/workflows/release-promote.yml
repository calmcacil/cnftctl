name: Release Candidate Promotion

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v
        required: true
        type: string
      candidate_run_id:
        description: Successful candidate workflow run ID
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: write

concurrency:
  group: release-promotion-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Download build-once candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cnftctl-${{ inputs.version }}-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify candidate, provenance, and version
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          target_sha=$(git rev-parse HEAD)
          test "$(git tag --points-at HEAD)" = "v$VERSION"
          test "$(git rev-list -n 1 "v$VERSION^{commit}")" = "$target_sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .name)" = "Release Candidate Build"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .path)" = ".github/workflows/release-build.yml"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .event)" = workflow_dispatch
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .head_sha)" = "$target_sha"
          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$target_sha...main" --jq .status)
          case "$relation" in ahead|identical) ;; *) exit 1 ;; esac
          cd candidate
          test "$(find . -type f -printf '%P\n' | LC_ALL=C sort)" = "$(printf '%s\n' "cnftctl_${VERSION}_amd64.deb" "cnftctl_${VERSION}_arm64.deb" release-checksums.txt sbom_amd64.spdx.json sbom_arm64.spdx.json | LC_ALL=C sort)"
          test -z "$(find . -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          sha256sum --check release-checksums.txt
          test "$(wc -l <release-checksums.txt)" -eq 4
          test "$(awk '{print $2}' release-checksums.txt | LC_ALL=C sort)" = "$(printf '%s\n' "cnftctl_${VERSION}_amd64.deb" "cnftctl_${VERSION}_arm64.deb" sbom_amd64.spdx.json sbom_arm64.spdx.json | LC_ALL=C sort)"
          signer_host=${GITHUB_SERVER_URL#https://}
          for arch in amd64 arm64; do
            gh attestation verify "cnftctl_${VERSION}_${arch}.deb" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_host/$GITHUB_REPOSITORY/.github/workflows/release-build.yml@refs/heads/main" \
              --signer-digest "$target_sha" \
              --source-digest "$target_sha" \
              --source-ref refs/heads/main
          done
          cd ..
          sh ./scripts/verify-deb.sh "candidate/cnftctl_${VERSION}_amd64.deb" "$VERSION" amd64
          sh ./scripts/verify-deb.sh "candidate/cnftctl_${VERSION}_arm64.deb" "$VERSION" arm64
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            "candidate/cnftctl_${VERSION}_amd64.deb" \
            "candidate/cnftctl_${VERSION}_arm64.deb" \
            candidate/release-checksums.txt \
            candidate/sbom_amd64.spdx.json \
            candidate/sbom_arm64.spdx.json \
            --verify-tag --generate-notes
